<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Flash Sale — date range cases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* measured from the delivered artwork, as % of the 4160px page */
    --digit-l: 63.1%;  --digit-t: 18.0%;  --digit-w: 10.0%;  --digit-h: 9.6%;
    --date-l: 74.3%;   --date-t: 23.8%;   --date-w: 20.4%;   --date-h: 5.8%;
    --grid-x1: 5.3%;   --grid-x2: 36.0%;  --grid-x3: 66.6%;
    --grid-y1: 32.7%;  --grid-y2: 62.8%;  --card-w: 28.2%;
  }
  body { margin: 0; background: #1b1b22; color: #ddd; font-family: Kanit, sans-serif; }
  h1 { font-size: 18px; font-weight: 600; margin: 18px 16px 4px; }
  p.note { font-size: 13px; margin: 0 16px 16px; color: #9a9aa8; max-width: 70ch; line-height: 1.6; }
  .row { display: flex; gap: 18px; padding: 0 16px 28px; flex-wrap: wrap; }
  .holder { width: 460px; }
  .holder h2 { font-size: 14px; font-weight: 500; margin: 0 0 6px; color: #cfcfe0; }
  .holder .meta { font-size: 12px; color: #8f8fa2; margin: 0 0 8px; min-height: 2.6em; line-height: 1.4; }
  .viewport { width: 460px; height: 460px; overflow: hidden; border-radius: 6px; }

  /* the real page: always 4160, scaled only for viewing */
  .stage {
    width: 4160px; height: 4160px; position: relative;
    transform-origin: top left; transform: scale(0.110576);
    background: #38088f;
  }
  .stage .bg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .digit {
    position: absolute; left: var(--digit-l); top: var(--digit-t);
    width: var(--digit-w); height: var(--digit-h);
    display: flex; align-items: center; justify-content: center; gap: 0;
  }
  .digit img { height: 100%; width: auto; display: block; }

  .daterange {
    position: absolute; left: var(--date-l); top: var(--date-t);
    width: var(--date-w); height: var(--date-h);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 600; line-height: 1; white-space: nowrap;
  }

  .card {
    position: absolute; width: var(--card-w); aspect-ratio: 1;
  }
  .card .frame { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card .code {
    position: absolute; left: 28.8%; top: 4.6%; width: 41.1%; height: 10.8%;
    display: flex; align-items: center; justify-content: center;
    color: #17170a; font-weight: 600; line-height: 1;
  }
  .card .name {
    position: absolute; left: 6%; top: 17.5%; width: 88%; height: 13%;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    text-align: center; color: #10204e; font-weight: 600; line-height: 1.18;
  }
  .card .photo {
    position: absolute; left: 8%; top: 31.5%; width: 84%; height: 46%;
    display: flex; align-items: center; justify-content: center;
  }
  .card .photo img { display: block; }
  .card .price {
    position: absolute; left: 28%; top: 79.4%; width: 61%; height: 16.4%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 600; line-height: 1; white-space: nowrap;
  }
</style>
</head>
<body>

<h1>Flash Sale — ช่วงวันที่ 3 แบบ บนไฟล์พื้นหลังจริง</h1>
<p class="note">
  สินค้าดึงจากโปรโมชัน 408 (BKK) ของจริง · พื้นหลัง เลข และการ์ด ใช้ไฟล์ที่ทีมออกแบบส่งมา ·
  หน้าจริงเรนเดอร์ที่ 4160 × 4160 px ย่อลงเพื่อดูเท่านั้น ·
  ข้อความวันที่ย่อขนาดอัตโนมัติให้พอดีป้าย (ทางเลือก ข)
</p>

<div class="row" id="row"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
// real payload: POST /ItemService2/PaperProFlash {idPromotion:"408", zone:"BKK"}
const DATA = {
  head: { id: 408, name: 'Flash I', day: 7, dayActive: '01-07 พ.ย. 2568' },
  list: [
    { goodCode: '13690', barCode: '101311', goodName: 'Swisse Calcium+Vitamin D3 90tab', flashPrice: 220 },
    { goodCode: '11800', barCode: '101258', goodName: 'Swisse Astaxanthin+Gluta 1x30cap', flashPrice: 510 },
    { goodCode: '13974', barCode: '514846', goodName: 'Testsealabs 1x1test 2in1 ATK Covid-19', flashPrice: 12.3 },
    { goodCode: '10738', barCode: '514382', goodName: 'Testsealabs 1x1test(Home Test) ATK Covid-19', flashPrice: 22.19 },
    { goodCode: '12612', barCode: '514665', goodName: 'Testsealabs Flu A/B+Covid 19 ATK (Orange)', flashPrice: 43.18 },
    { goodCode: '9385', barCode: '101218', goodName: 'GPO Omeprazole 20mg 1x10x10cap', flashPrice: 59.25 },
  ],
};

const CASES = [
  { key: 'same',  title: 'เดือนเดียวกัน',  text: '01-07 พ.ย. 2568',          note: 'ค่าจริงจาก dayActive ของโปรโมชัน 408' },
  { key: 'month', title: 'ข้ามเดือน',      text: '28 ก.ย. – 4 ต.ค. 2569',    note: 'ยาวกว่าแบบแรก ป้ายเริ่มตึง' },
  { key: 'year',  title: 'ข้ามปี',         text: '28 ธ.ค. 2569 – 3 ม.ค. 2570', note: 'ยาวที่สุด ต้องย่อตัวอักษรลงมาก' },
];

const money = (n) => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '.-';

function buildCard(item, x, y) {
  const el = document.createElement('div');
  el.className = 'card';
  el.style.left = x;
  el.style.top = y;
  el.innerHTML = `
    <img class="frame" src="/image/FS/card.png" alt="">
    <div class="code">${item.barCode}</div>
    <div class="name">${item.goodName}</div>
    <div class="photo"><img src="https://file.drugnetcenter.com/drugpos/GoodPictures/${item.goodCode}.jpg" alt="" crossorigin="anonymous"></div>
    <div class="price">${money(item.flashPrice)}</div>`;
  return el;
}

function buildStage(dateText) {
  const stage = document.createElement('div');
  stage.className = 'stage';

  const bg = document.createElement('img');
  bg.className = 'bg';
  bg.src = '/image/FS/bg.jpg';
  stage.appendChild(bg);

  // day count: one image per digit, composed. Capped at 9 — the slot in the
  // artwork is ~415px and two digits need ~674px.
  const digit = document.createElement('div');
  digit.className = 'digit';
  const shown = Math.min(DATA.head.day, 9);
  String(shown).split('').forEach(d => {
    const i = document.createElement('img');
    i.src = `/image/FS/number/${d}.png`;
    digit.appendChild(i);
  });
  stage.appendChild(digit);

  const date = document.createElement('div');
  date.className = 'daterange';
  date.textContent = dateText;
  stage.appendChild(date);

  const xs = ['var(--grid-x1)', 'var(--grid-x2)', 'var(--grid-x3)'];
  DATA.list.slice(0, 6).forEach((item, n) => {
    const y = n < 3 ? 'var(--grid-y1)' : 'var(--grid-y2)';
    stage.appendChild(buildCard(item, xs[n % 3], y));
  });
  return stage;
}

/** shrink until it fits the baked chip, down to a floor, and report the result */
function fitText(el, startPx, minPx) {
  let size = startPx;
  el.style.fontSize = size + 'px';
  const limit = el.clientWidth;
  while (size > minPx && el.scrollWidth > limit) {
    size -= 2;
    el.style.fontSize = size + 'px';
  }
  return { size, fits: el.scrollWidth <= limit + 1, limit, needed: el.scrollWidth };
}

function sizeCard(stage) {
  stage.querySelectorAll('.card').forEach(card => {
    const w = card.getBoundingClientRect().width / 0.110576; // undo the view scale
    card.querySelector('.code').style.fontSize = (w * 0.075) + 'px';
    card.querySelector('.name').style.fontSize = (w * 0.058) + 'px';
    card.querySelector('.price').style.fontSize = (w * 0.105) + 'px';
  });
  stage.querySelectorAll('.photo img').forEach(img => {
    const box = img.parentElement.getBoundingClientRect();
    const bw = box.width / 0.110576, bh = box.height / 0.110576;
    if (!img.naturalWidth) return;
    const s = Math.min(bw / img.naturalWidth, bh / img.naturalHeight);
    img.style.width = Math.round(img.naturalWidth * s) + 'px';
    img.style.height = Math.round(img.naturalHeight * s) + 'px';
  });
}

window.__report = {};

(async () => {
  await document.fonts.ready;
  const row = document.getElementById('row');

  for (const c of CASES) {
    const holder = document.createElement('div');
    holder.className = 'holder';
    holder.innerHTML = `<h2>${c.title}</h2><p class="meta" id="meta-${c.key}">${c.note}</p>`;
    const vp = document.createElement('div');
    vp.className = 'viewport';
    const stage = buildStage(c.text);
    stage.id = 'stage-' + c.key;
    vp.appendChild(stage);
    holder.appendChild(vp);
    row.appendChild(holder);
  }

  // let images land, then size everything that depends on measured boxes
  await new Promise(r => setTimeout(r, 1200));
  for (const c of CASES) {
    const stage = document.getElementById('stage-' + c.key);
    sizeCard(stage);
    const el = stage.querySelector('.daterange');
    const res = fitText(el, 108, 48);
    window.__report[c.key] = res;
    document.getElementById('meta-' + c.key).textContent =
      `${c.note} — ต้องการ ${Math.round(res.needed)}px ในช่อง ${Math.round(res.limit)}px → ตัวอักษร ${res.size}px${res.fits ? '' : ' (ยังไม่พอ)'}`;
  }
  window.__ready = true;
})();

window.exportCase = async (key, scale) => {
  const stage = document.getElementById('stage-' + key);
  const prev = stage.style.transform;
  stage.style.transform = 'scale(1)';
  const canvas = await html2canvas(stage, { useCORS: true, scale: 1, logging: false, width: 4160, height: 4160 });
  stage.style.transform = prev;
  const out = document.createElement('canvas');
  out.width = Math.round(4160 * scale); out.height = Math.round(4160 * scale);
  out.getContext('2d').drawImage(canvas, 0, 0, out.width, out.height);
  return out.toDataURL('image/jpeg', 0.92);
};
</script>
</body>
</html>
