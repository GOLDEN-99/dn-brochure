@if (!backgroundMissing()) {
  <img
    class="fs-bg"
    [src]="backgroundUrl"
    alt=""
    (error)="backgroundMissing.set(true)"
  />
}

@if (dayDigits().length) {
  <div class="fs-digit">
    @for (d of dayDigits(); track $index) {
      <img [src]="'/image/FS/number/' + d + '.png'" alt="" />
    }
  </div>
}

@if (dateRange(); as range) {
  <div class="fs-date" #dateEl>{{ range }}</div>
}

@for (item of visibleItems(); track $index; let i = $index) {
  <app-flash-sale-card [cardProp]="item" [slot]="slots()[i]" />
}
