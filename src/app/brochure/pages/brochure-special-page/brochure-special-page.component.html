@if (exporting()) {
  <div class="loading">
    <output
      class="spinner-border text-success"
      style="width: 10rem; height: 10rem"
    >
      <span class="sr-only"></span>
    </output>
  </div>
}
@if (loading()) {
  <div class="loading">
    <output
      class="spinner-border text-success"
      style="width: 10rem; height: 10rem"
    >
      <span class="sr-only"></span>
    </output>
  </div>
} @else {
  @let res = result();
  @if (res) {
    <section class="container">
      <div class="d-flex my-3 align-items-center justify-content-between">
        <h4 class="shop-name">{{ res.head.wholeName }}</h4>

        <div class="d-flex">
          <div>ประเภท :</div>
          <div>{{ res.head.promotionType | brochurePromotion }}</div>
        </div>
      </div>

      <div class="content-wrapper">
        <brochure-page
          [priceType]="priceType"
          [head]="res.head"
          [itemList]="currentGroup()"
          [size]="res.pageSize"
        />
      </div>
      <nav class="mt-3 d-flex justify-content-center">
        <ul class="pagination">
          @for (item of totalPage(); track $index) {
            <li class="page-item">
              <button
                (click)="onSetPage(item)"
                [class]="
                  $index === currentPage() ? 'page-link active' : 'page-link'
                "
              >
                {{ item + 1 }}
              </button>
            </li>
          }
        </ul>
      </nav>
      <div
        class="d-flex align-items-center mb-3 justify-content-between action"
      >
        <button class="btn btn-primary" (click)="onExport()">export</button>
      </div>
    </section>
    <div class="not-show">
      @for (g of res.list; track $index) {
        <brochure-page
          [priceType]="priceType"
          [head]="res.head"
          [itemList]="g"
          [size]="res.pageSize"
          [isStatic]="true"
        />
      }
    </div>
  }
}
