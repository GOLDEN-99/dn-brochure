@let resultOpt = resultOption();
<div class="app-form-field">
  <label for="remark"
    >เลือกเพิ่มเติม
    @if (required()) {
      <span class="text-danger">*</span>
    }
  </label>
  <select
    name="remark"
    id="remark"
    class="form-select"
    [name]="name()"
    [(ngModel)]="value"
    [compareWith]="compareRemarkFn"
    (blur)="onBlur()"
    [name]="name()"
  >
    <option [ngValue]="null" disabled>กรุณาเลือกสาเหตุ</option>
    @for (opt of resultOpt; track $index) {
      <option [ngValue]="opt">
        {{ opt.result }}
      </option>
    }
  </select>
  @if (touched()) {
    <div class="d-flex flex-column">
      @for (error of errors(); track $index) {
        <span class="text-danger">{{ error.message }}</span>
      }
    </div>
  }
</div>
