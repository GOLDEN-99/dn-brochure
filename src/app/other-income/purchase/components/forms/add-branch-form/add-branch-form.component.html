<div class="row row-cols-1 row-cols-md-3 g-2 align-items-end mb-2">
  <div class="col">
    <label class="form-label small text-muted mb-1" for="add-branch-search"
      >รหัสสาขา
      @if (addBranchForm.branchCode().required()) {
        <span class="text-danger">*</span>
      }
    </label>
    @if (addBranchForm.branchCode().value(); as branchCode) {
      <div class="d-flex align-items-center gap-2">
        <span class="form-control form-control-sm bg-light">{{ branchCode }} - {{ addBranchForm.branchName().value() }}</span>
        <button
          type="button"
          class="btn btn-sm btn-outline-secondary"
          (click)="clearBranch()"
        >
          เปลี่ยน
        </button>
      </div>
    } @else {
      <input
        id="add-branch-search"
        type="text"
        class="form-control form-control-sm"
        placeholder="พิมพ์รหัสหรือชื่อสาขา..."
        [ngbTypeahead]="searchBranch"
        [resultFormatter]="formatBranch"
        [inputFormatter]="formatBranch"
        (selectItem)="onSelectBranch($event)"
      />
    }
    <app-form-alert-text [formState]="addBranchForm.branchCode()" />
  </div>

  <div class="col">
    <label [htmlFor]="addBranchForm.openDate().name()" class="form-label small text-muted mb-1"
      >วันที่เปิดสาขา</label
    >
    <app-signal-datepicker
      [id]="addBranchForm.openDate().name()"
      [formField]="addBranchForm.openDate"
    />
  </div>
</div>

<button
  type="button"
  class="btn btn-sm btn-primary"
  [disabled]="!canSubmit()"
  (click)="onSubmit()"
>
  เพิ่มสาขา
</button>
