<div class="row row-cols-1 row-cols-md-4 g-3 mb-3">
  <div class="col">
    <label
      [htmlFor]="appendReceiptForm.receNumb().name()"
      class="form-label small text-muted mb-1"
      >เลขที่ใบเสร็จ
      @if (appendReceiptForm.receNumb().required()) {
        <span class="text-danger">*</span>
      }
    </label>
    <input
      [id]="appendReceiptForm.receNumb().name()"
      type="text"
      class="form-control form-control-sm"
      [formField]="appendReceiptForm.receNumb"
    />
    <div style="min-height: 1.25rem" class="mt-1">
      <app-form-alert-text [formState]="appendReceiptForm.receNumb()" />
    </div>
  </div>

  <div class="col">
    <label
      [htmlFor]="appendReceiptForm.receDate().name()"
      class="form-label small text-muted mb-1"
      >วันที่ใบเสร็จ</label
    >
    <app-signal-datepicker
      [id]="appendReceiptForm.receDate().name()"
      [formField]="appendReceiptForm.receDate"
    />
    <div style="min-height: 1.25rem" class="mt-1"></div>
  </div>

  <div class="col">
    <label
      [htmlFor]="appendReceiptForm.receAmount().name()"
      class="form-label small text-muted mb-1"
      >ยอด
      @if (appendReceiptForm.receAmount().required()) {
        <span class="text-danger">*</span>
      }
    </label>
    <input
      [id]="appendReceiptForm.receAmount().name()"
      type="number"
      class="form-control form-control-sm"
      [formField]="appendReceiptForm.receAmount"
    />
    <div style="min-height: 1.25rem" class="mt-1">
      <app-form-alert-text [formState]="appendReceiptForm.receAmount()" />
    </div>
  </div>

  <div class="col">
    <label
      [htmlFor]="appendReceiptForm.receRemark().name()"
      class="form-label small text-muted mb-1"
      >หมายเหตุ</label
    >
    <input
      [id]="appendReceiptForm.receRemark().name()"
      type="text"
      class="form-control form-control-sm"
      [formField]="appendReceiptForm.receRemark"
    />
    <div style="min-height: 1.25rem" class="mt-1"></div>
  </div>
</div>

<hr class="my-2" />

<div class="row row-cols-1 row-cols-md-4 g-3 mb-3">
  <div class="col">
    <label class="form-label small text-muted mb-1"
      >ใบแจ้งหนี้ที่จะจับคู่</label
    >
    <input
      type="text"
      class="form-control form-control-sm"
      placeholder="ค้นหาเลขที่ใบแจ้งหนี้"
      [ngbTypeahead]="searchInvoice"
      [resultFormatter]="formatInvoice"
      [inputFormatter]="formatInvoice"
      (selectItem)="onSelectInvoice($event)"
    />
    <div style="min-height: 1.25rem" class="mt-1"></div>
  </div>

  @if (pendingMatchForm.invoice().value(); as pendingInvoice) {
    <div class="col">
      <label for="pending-match-remaining" class="form-label small text-muted mb-1"
        >ยอดคงเหลือของใบแจ้งหนี้</label
      >
      <input
        id="pending-match-remaining"
        type="text"
        class="form-control form-control-sm"
        readonly
        [ngModel]="pendingInvoice.remainingAmount | number: '1.2-2'"
      />
      <div style="min-height: 1.25rem" class="mt-1"></div>
    </div>

    <div class="col">
      <label
        [htmlFor]="pendingMatchForm.matchAmount().name()"
        class="form-label small text-muted mb-1"
        >ยอดที่จับคู่</label
      >
      <div class="d-flex gap-2">
        <input
          [id]="pendingMatchForm.matchAmount().name()"
          type="number"
          class="form-control form-control-sm"
          [formField]="pendingMatchForm.matchAmount"
        />
        <button
          type="button"
          class="btn btn-sm btn-outline-primary text-nowrap"
          [disabled]="!canConfirmMatch()"
          (click)="addMatch()"
        >
          เพิ่มรายการ
        </button>
        <button
          type="button"
          class="btn btn-sm btn-outline-secondary text-nowrap"
          (click)="cancelPendingMatch()"
        >
          ยกเลิก
        </button>
      </div>
      <div style="min-height: 1.25rem" class="mt-1">
        <app-form-alert-text [formState]="pendingMatchForm.matchAmount()" />
      </div>
    </div>
  }
</div>

<div class="table-responsive mb-2">
  <table class="table table-sm table-bordered mb-1" style="font-size: 12px">
    <thead>
      <tr>
        <th>เลขที่ใบแจ้งหนี้</th>
        <th>ยอดที่จับคู่</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (m of appendReceiptForm.matches().value(); track m.invoice.id) {
        <tr>
          <td>{{ m.invoice.invoiceNumb }}</td>
          <td>{{ m.matchAmount }}</td>
          <td class="text-end">
            <button
              type="button"
              class="btn btn-sm btn-outline-danger"
              (click)="removeMatch($index)"
            >
              ลบ
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3" class="text-center text-muted py-2">
            ยังไม่มีรายการจับคู่
          </td>
        </tr>
      }
    </tbody>
    <tfoot>
      <tr>
        <th>รวม</th>
        <th>{{ matchedTotal() }}</th>
        <th></th>
      </tr>
    </tfoot>
  </table>
  <app-form-alert-text [formState]="appendReceiptForm.matches()" />
</div>

<button
  type="button"
  class="btn btn-sm btn-primary"
  [disabled]="!canSubmit()"
  (click)="onSubmit()"
>
  เพิ่มใบเสร็จและจับคู่
</button>
