<div class="app-form-select">
  <label
    >กิจกรรม
    @if (form()().required()) {
      <span class="text-danger">*</span>
    }
  </label>
  <app-select [formField]="form()">
    @for (event of renderEvent(); track event.id) {
      <app-option [value]="event">{{ event.eventName }}</app-option>
    }
  </app-select>
</div>
