@let prop = cardProp();

<img class="fs-frame" src="/image/FS/card.png" alt="" />

<div class="fs-code">{{ prop.barCode }}</div>

<div class="fs-name">{{ prop.goodName }}</div>

<div class="fs-photo">
  @if (!imgFailed()) {
    <img
      [src]="imgUrl()"
      alt=""
      (load)="handleOnLoad($event)"
      (error)="imgFailed.set(true)"
    />
  }
</div>

<div class="fs-price">{{ prop.flashPrice | number : "1.2-2" }}.-</div>
