@let prop = cardProp();

<div [className]="headerClass()">
  <img src="/image/FS/head.png" alt="head" />
  <div [className]="textClass()">{{ prop.goodName }}</div>
</div>
<div [className]="contentClass()">
  <div class="content-section" style="flex-direction: column; display: flex">
    <div style="display: flex">
      <div [className]="goodCodeClass()">{{ prop.barCode }}</div>
      <div style="flex: 1 1 auto"></div>
    </div>
    <div style="display: flex; justify-content: center; flex: 1 1 auto">
      <img [src]="imgUrl()" class="product-img" alt="product image" />
    </div>
  </div>
  <div class="content-section" style="position: relative; align-items: end">
    <div [className]="priceTextClass()">
      {{ prop.flashPrice | number : "1.2-2" }}.-
    </div>
    <img src="/image/FS/price.png" alt="price" style="width: 100%" />
  </div>
</div>
