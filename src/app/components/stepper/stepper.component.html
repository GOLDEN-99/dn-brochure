<div class="stepper">
  <ng-container [ngTemplateOutlet]="currentStep()" />
  <div class="btn-wrapper">
    @if (!isLast()) {
    <button class="btn btn-primary" (click)="next()">ถัดไป</button>
    } @if (!isFirst()) {

    <button class="btn btn-danger" (click)="back()">ย้อนกลับ</button>
    } @if (isLast()) {

    <button class="btn btn-info">ยืนยัน</button>
    }
  </div>
</div>
