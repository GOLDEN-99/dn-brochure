@let optionlist = options(); @let ctrl = control();
<div class="mb-3">
  <label for="dropdown">เลือกประเภทโบรชัว</label>
  <select
    [formControl]="ctrl"
    name="promotype"
    id="dropdown"
    class="form-select"
  >
    @for (opt of optionlist; track $index) {
    <option [value]="opt.value">{{ opt.label }}</option>
    }
  </select>
</div>
