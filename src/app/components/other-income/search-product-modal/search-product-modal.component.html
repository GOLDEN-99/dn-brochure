<div class="modal-header">
  <h4 class="modal-title">ค้นหาสินค้า</h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="onClose()"
  ></button>
</div>
<div class="modal-body">
  <div class="app-form-field">
    <label for="search-term-input">ชื่อสินค้า</label>
    <input
      type="text"
      name="search-term-input"
      id="search-term-input"
      [(ngModel)]="term"
    />
  </div>
  @let products = result();
  <!---->
  @if (products.length !== 0) {
  <!---->
  <div class="row">
    <div class="col-1">
      <div class="app-form-check">
        <input
          type="checkbox"
          name="checkbox-product-all"
          id="checkbox-product-all"
          [ngModel]="isSelectAllItem()"
          (ngModelChange)="selectAll($event)"
        />
      </div>
    </div>
    <div class="col">ทั้งหมด</div>
  </div>
  @for (product of products; track product.goodCode) {
  <div class="row">
    <div class="col-1">
      <div class="app-form-check">
        <input
          type="checkbox"
          [attr.name]="'checkbox-product-' + product.goodCode"
          [id]="'checkbox-product-' + product.goodCode"
          [ngModel]="product.check"
          (ngModelChange)="selectSomeProduct(product.goodCode)"
        />
      </div>
    </div>
    <div class="col">{{ product.goodName }}</div>
  </div>
  } }
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-info" (click)="submit()">บันทึก</button>
</div>
