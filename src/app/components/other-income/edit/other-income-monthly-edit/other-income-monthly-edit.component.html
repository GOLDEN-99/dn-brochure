<div class="mb-3">
  <div class="row" style="justify-content: space-between">
    <h2 class="col-auto">รายการรับรู้รายเดือน</h2>
    @if (canEdit()) {
      <div class="col-auto">
        <button class="btn btn-primary" (click)="openModal(monthlyModal)">
          เพิ่มรายได้รายเดือน
        </button>
      </div>
    }
  </div>
</div>

<ng-template #monthlyModal let-modal>
  <div class="modal-header">
    <h4 class="modal-title">รับรู้รายเดือน</h4>
    <button
      type="button"
      class="btn-close"
      aria-label="Close"
      (click)="modal.dismiss()"
    ></button>
  </div>
  <div class="modal-body">
    <app-month-select
      [month]="date().month"
      (monthChange)="onMonthChange($event)"
    />
    <app-year-select [year]="date().year" (yearChange)="onYearChange($event)" />
    <div class="mb-3">
      <button class="btn btn-info w-100" (click)="onSearch()">ดึงยอด</button>
    </div>
    <div style="max-width: 100%; overflow-x: auto">
      <table class="table">
        <thead>
          <tr>
            <td>rece</td>
            <td>บิลซัพ</td>
            <td>ยอดคำนวน</td>
          </tr>
        </thead>
        <tbody>
          @for (inc of calIncome(); track $index) {
            <tr>
              <td>{{ inc.receNumb }}</td>
              <td>{{ inc.billNumb }}</td>
              <td>{{ inc.calAmount | number: "1.2-2" }}</td>
            </tr>
          }
          <tr>
            <td>รวม</td>
            <td></td>
            <td>{{ summary() | number: "1.2-2" }}</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="app-form-field-inline" style="justify-content: space-between">
      <div>
        <label for="total">ยอดรวม</label>
      </div>
      <div>
        <input type="text" id="total" readonly [ngModel]="rawTotalAmount()" />
      </div>
    </div>
    <div class="app-form-field-inline" style="justify-content: space-between">
      <div>
        <label for="cn">ยอด cn</label>
      </div>
      <div>
        <input type="text" id="cn" [ngModel]="rawCnAmount()" (blur)="onCnBlur($any($event.target).value)" />
      </div>
    </div>
    <div class="app-form-field-inline" style="justify-content: space-between">
      <div>
        <label for="actual">ยอดจริง</label>
      </div>
      <div>
        <input type="text" id="actual" [ngModel]="rawActualAmount()" (blur)="onActualBlur($any($event.target).value)" />
      </div>
    </div>
    <div class="app-form-field-inline" style="justify-content: space-between">
      <div>
        <label for="reason">เหตุผล</label>
      </div>
      <div>
        <input type="text" id="reason" [(ngModel)]="reason" />
      </div>
    </div>
    <div class="app-form-field-inline" style="justify-content: space-between">
      <div>
        <label for="income">ประมาณการรายได้</label>
      </div>
      <div>
        <input type="text" id="income" readonly [ngModel]="incomeAmount() | number: '1.2-2'" />
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button
      class="btn btn-primary w-100"
      (click)="onSubmit()"
      [disabled]="disableOnclick()"
    >
      บันทึก
    </button>
  </div>
</ng-template>
