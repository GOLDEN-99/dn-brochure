<div class="mb-3">
  @let cur = value();
  <div class="row" style="justify-content: space-between">
    <h2 class="col-auto">รายการสินค้า</h2>
    @if (canEdit()) {
    <div class="col-auto">
      <button class="btn btn-primary">เพิ่ม</button>
    </div>
    }
  </div>

  <table class="table">
    <thead>
      <tr>
        <th style="width: 25%">รหัส</th>
        <th style="width: 75%">ชื่อ</th>
        <!-- <th></th> -->
      </tr>
    </thead>
    <tbody>
      @let products = cur.productList;
      <!---->
      @for (product of products; track product.id) {
      <tr>
        <td>{{ product.goodCode }}</td>
        <td>{{ product.goodName }}</td>
        <!-- <td>
          <button class="btn btn-danger"><i class="bi bi-trash"></i></button>
        </td> -->
      </tr>
      }
    </tbody>
  </table>
</div>
