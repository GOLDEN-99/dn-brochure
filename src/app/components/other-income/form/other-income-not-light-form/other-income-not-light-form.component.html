<div class="row">
  <div class="app-form-field-inline col-md">
    <div>
      <label for="cn">CN</label>
    </div>
    <div>
      <input type="text" name="cn" id="cn" [(ngModel)]="cn" />
    </div>
  </div>
  <div class="app-form-field-inline col-md">
    <div>
      <label for="displayName">ชื่อเรียกเก็บ</label>
    </div>
    <div>
      <input
        type="text"
        name="displayName"
        id="displayName"
        [(ngModel)]="displayName"
      />
    </div>
  </div>
</div>
<app-income-select
  [(incomeId)]="incomeId"
  (isProductChange)="isProduct.set($event)"
/>
<app-discount-subform [(discountType)]="discountId" />
<div class="row">
  <div class="col-md-3">VAT</div>
  <div class="col-md">
    <div class="app-form-check">
      <input
        type="radio"
        name="vat"
        id="include"
        [value]="true"
        [(ngModel)]="incVat"
      />
      <label for="include">รวม vat</label>
    </div>
  </div>
  <div class="col-md">
    <div class="app-form-check">
      <input
        type="radio"
        name="vat"
        id="exclude"
        [value]="false"
        [(ngModel)]="incVat"
      />
      <label for="exclude">ไม่รวม vat</label>
    </div>
  </div>
</div>
<div class="row">
  <div class="col-md-3">จ่ายไม่เกินกำหนด</div>
  <div class="col-md">
    <div class="app-form-check">
      <input
        type="radio"
        name="cap"
        id="cap-null"
        [value]="false"
        [ngModel]="isNullCap()"
        (input)="capAmount.set(0)"
      />
      <label for="cap-null">กำหนด (บาท)</label>
    </div>
    @if (!isNullCap()) {
    <div class="app-form-field">
      <label for="capAmount">ระบุ (บาท)</label>
      <input type="number" [(ngModel)]="capAmount" id="capAmount" />
    </div>
    }
  </div>
  <div class="col-md">
    <div class="app-form-check">
      <input
        type="radio"
        name="cap"
        id="cap-true"
        [value]="true"
        [ngModel]="isNullCap()"
        (input)="capAmount.set(null)"
      />
      <label for="cap-true">ไม่กำหนด</label>
    </div>
  </div>
</div>
@if (isProduct()) {
<app-search-product-subform
  [selectProducts]="productsList()"
  (onAdd)="handleAdd($event)"
  (onDelete)="handleDelete($event)"
/>
}
<app-target-subform [(target)]="stepType" [(step)]="stepList" />
<div class="d-flex justify-content-center" style="gap: 1rem">
  <button class="btn btn-success" (click)="onSubmit()" [disabled]="disable()">
    <i class="bi bi-floppy"></i>
    <span> บันทึก </span>
  </button>
  <a routerLink="/other-income/purchase" class="btn btn-outline-danger"
    >ย้อนกลับ</a
  >
</div>
