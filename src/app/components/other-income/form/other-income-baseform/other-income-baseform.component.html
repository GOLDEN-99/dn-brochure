@let formData = state();
<div class="app-form-field-inline">
  <div>
    <label for="displayName">ชื่อรายรับภายใน (ถ้ามี)</label>
  </div>
  <div>
    <input
      type="text"
      name="displayName"
      id="displayName"
      [ngModel]="formData.displayName"
      (ngModelChange)="updateName($event)"
    />
  </div>
</div>
<app-event-select
  [eventId]="formData.eventId"
  (eventIdChange)="updateEvent($event)"
  [filter]="mode()"
  (isLightChange)="onSelectEventTypeChange($event)"
/>
<div class="border rounded p-3 mb-3">
  <p class="fw-semibold mb-2 text-muted small">รับรู้รายได้เป็น</p>
  <div class="row row-cols-2 g-2">
    <div class="col">
      <app-income-select [incomeId]="incomeIdType1()" [incomeType]="1" (incomeIdChange)="updateIncomeByType(1, $event)" />
    </div>
    <div class="col">
      <app-income-select [incomeId]="incomeIdType2()" [incomeType]="2" (incomeIdChange)="updateIncomeByType(2, $event)" />
    </div>
    <div class="col">
      <app-income-select [incomeId]="incomeIdType3()" [incomeType]="3" (incomeIdChange)="updateIncomeByType(3, $event)" />
    </div>
    <div class="col">
      <app-income-select [incomeId]="incomeIdType4()" [incomeType]="4" (incomeIdChange)="updateIncomeByType(4, $event)" />
    </div>
  </div>
</div>
<!-- period -->
<div class="mb-3">
  <label for="period" class="form-label">ระยะเวลาเก็บเงิน</label>
  <select
    name="period"
    id="period"
    class="form-select"
    [ngModel]="formData.period"
    (ngModelChange)="updatePeriod($event)"
  >
    <option [ngValue]="0" disabled>กรุณาเลือก</option>
    <option [ngValue]="1">1 เดือน</option>
    <option [ngValue]="2">2 เดือน</option>
    <option [ngValue]="3">3 เดือน</option>
    <option [ngValue]="6">6 เดือน</option>
    <option [ngValue]="12">12 เดือน</option>
  </select>
</div>
<!-- date picker -->
<div class="row">
  <div class="col">
    <app-date-input
      label="วันที่เริ่ม"
      [date]="formData.startDate"
      (dateChange)="updateStartDate($event)"
    />
  </div>
  <div class="col">
    <app-date-input
      label="วันที่สิ้นสุด"
      [date]="formData.endDate"
      (dateChange)="updateEndDate($event)"
    />
  </div>
</div>
<app-search-comp-subform
  [compType]="formData.compType"
  (compTypeChange)="onCompTypeChange($event)"
  [compCode]="formData.compCode"
  (compCodeChange)="onCompCodeChange($event)"
  [compName]="formData.compName"
  (compNameChange)="updateCompName($event)"
/>
@let products = productList();
@if (eventType() === 1) {
  @if (validPair().length > 0) {
    <div class="mb-3">
      <label for="pairId" class="form-label">เชื่อมกับหัวร่วม (ถ้ามี)</label>
      <select
        name="pairId"
        id="pairId"
        class="form-select"
        [ngModel]="pairId()"
        (ngModelChange)="updateDualPairId($event)"
      >
        <option [ngValue]="null">ไม่เชื่อม</option>
        @for (pair of validPair(); track pair.id) {
          <option [ngValue]="pair.id">{{ pair.displayName }}</option>
        }
      </select>
    </div>
  }
  @if (products !== null && formData.compCode !== "") {
    <app-search-product-subform
      [comp]="searchProductParam()"
      [selectProducts]="products"
      (onAdd)="handleAdd($event)"
      (onDelete)="handleDelete($event)"
    />
  }
}
