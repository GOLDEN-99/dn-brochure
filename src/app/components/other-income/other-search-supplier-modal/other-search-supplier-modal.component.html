<div class="modal-header">
  <h4 class="modal-title">ค้นหาสินค้า</h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="onClose()"
  ></button>
</div>
<div class="modal-body">
  <div class="app-form-field">
    <label for="search-term-input">ชื่อบริษัท</label>
    <input
      type="text"
      name="search-term-input"
      id="search-term-input"
      [(ngModel)]="term"
    />
  </div>
  @let compList = result();
  <!---->
  @if (compList.length !== 0) {
  <!---->
  <div class="row">
    <div class="col">รหัสบริษัท</div>
    <div class="col">ชื่อบริษัท</div>
    <div class="col"></div>
  </div>
  <ul
    style="
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    "
  >
    @for (comp of compList; track $index) {
    <li class="row" style="list-style: none">
      <div class="col">{{ comp.compCode }}</div>
      <div class="col">{{ comp.compName }}</div>
      <div class="col">
        <button class="btn btn-success" (click)="selectComp.emit(comp)">
          <i class="bi bi-plus"></i>
        </button>
      </div>
    </li>
    }
  </ul>
  }
</div>
<div class="modal-footer">
  <!-- <button type="button" class="btn btn-info" (click)="submit()">บันทึก</button> -->
</div>
