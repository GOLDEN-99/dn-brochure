<h2>สรุปรายการรายได้อื่นๆ</h2>
<div class="row">
  <span class="text-danger">***จัดซื้อ - ดูสัญญารายได้อื่นๆทั้งหมด***</span>
  <span class="text-danger"
    >***บัญชี - ดูประมาณการ ใบแจ้งหนี้ ใบลดหนี้ ใบเสร็จรับเงิน สะสม***</span
  >
</div>
<div class="row mb-3 px-3" style="gap: 1rem">
  <button class="btn btn-dn col" (click)="onExportContract('DN')">
    DN - สรุปรายการ
  </button>
  <button class="btn btn-hu col" (click)="onExportContract('HU')">
    HU - สรุปรายการ
  </button>
</div>
<div class="row mb-3 px-3" style="gap: 1rem">
  <button class="btn btn-dn col" (click)="onCheckDifference('DN')">
    DN - ตรวจสอบความแตกต่าง
  </button>
  <button class="btn btn-hu col" (click)="onCheckDifference('HU')">
    HU - ตรวจสอบความแตกต่าง
  </button>
</div>
