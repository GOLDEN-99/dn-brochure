@let remarkOpt = remarkList();
<div class="mb-3">
  <label for="remark">สาเหตุ</label>
  <select
    name="remark"
    id="remark"
    class="form-select"
    [ngModel]="remarkOption()"
    (ngModelChange)="setRemarkOpt($event)"
    [compareWith]="compareRemarkFn"
  >
    @for (opt of remarkOpt; track $index) {
    <option [ngValue]="opt" [disabled]="opt.id === '0'">
      {{ opt.remark }}
    </option>
    }
  </select>
</div>
