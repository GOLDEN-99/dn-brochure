<div class="mb-3">
  <label for="showBank">สถานะ</label>
  <select
    name="showBank"
    id="showBank"
    [(ngModel)]="custStat"
    class="form-select"
    [compareWith]="compareStatFn"
  >
    @for (item of showBankRef; track $index) {
    <option [ngValue]="item">{{ item.stat }}</option>
    }
  </select>
</div>
