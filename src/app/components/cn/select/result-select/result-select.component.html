@let resultList = resultOption();
<div class="mb-3">
  <label for="reason">เลือกเพิ่มเติม</label>
  <select
    name="reason"
    id="reason"
    class="form-select"
    [(ngModel)]="selectedResult"
    [compareWith]="compareResultFn"
  >
    @for (opt of resultList; track $index) {
    <option [ngValue]="opt" [disabled]="opt.id === '-1'">
      {{ opt.result }}
    </option>
    }
  </select>
</div>
