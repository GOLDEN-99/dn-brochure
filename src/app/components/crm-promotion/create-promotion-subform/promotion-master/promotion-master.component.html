@let master = form();
<div class="row">
  <div class="col-lg-3">
    <div class="app-form-field">
      <label [htmlFor]="master.promotionName().name()">ชื่อโปรโมชั่น </label>

      <input type="text" id="pro-name" [formField]="master.promotionName" />
    </div>
  </div>
  <div class="col-lg-3">
    <div class="app-form-field">
      <label [htmlFor]="master.source().name()">โปรโมชั่นของ</label>

      <select class="form-select" id="source" [formField]="master.source">
        <option value="HU">Health up</option>
        <option value="SUPPLIER">Supplier</option>
        <option value="BOTH">BOTH</option>
      </select>
    </div>
  </div>
