<div class="row">
  <div class="col">
    <div class="form-check form-switch">
      <input
        class="form-check-input"
        type="checkbox"
        id="limit-time"
        [(ngModel)]="limitTime"
      />
      <label class="form-check-label" for="limit-time">จำกัดช่วงเวลา</label>
    </div>
  </div>
  <div class="col">
    <div class="row align-items-center">
      <div class="col-auto">
        <label for="start-time" style="width: 24px">เริ่ม</label>
        @if (required()) {
          <span class="text-danger">*</span>
        }
      </div>
      <div class="col">
        <ngb-timepicker
          [spinners]="false"
          [disabled]="!limitTime()"
          [ngModel]="timeSpan().startTime"
          (ngModelChange)="updateTimespan('startTime', $event)"
        />
      </div>
    </div>
  </div>
  <div class="col">
    <div class="row align-items-center">
      <div class="col-auto">
        <label for="start-time" style="width: 24px">จบ</label>
        @if (required()) {
          <span class="text-danger">*</span>
        }
      </div>
      <div class="col">
        <ngb-timepicker
        [spinners]="false"
          [disabled]="!limitTime()"
          [ngModel]="timeSpan().endTime"
          (ngModelChange)="updateTimespan('endTime', $event)"
        />
      </div>
    </div>
  </div>
</div>
