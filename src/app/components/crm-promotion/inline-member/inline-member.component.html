<div class="row">
  <div class="col-4">
    <div class="form-check form-switch">
      <input
        class="form-check-input"
        type="checkbox"
        id="is-branch-spec"
        [ngModel]="limitTier()"
        (ngModelChange)="onToggleTier($event)"
      />
      <label class="form-check-label" for="is-branch-spec"
        >จำกัดระดับสมาชิก</label
      >
    </div>
  </div>
  <div class="col-4">
    <div>
      <label
        class="form-label fw-semibold text-muted small mb-1"
        for="search-member"
        >ระดับสมาชิก</label
      >
      <input
        [disabled]="allowAddTier()"
        id="search-member"
        type="text"
        class="form-control form-control-sm"
        placeholder="พิมพ์เพื่อค้นหา..."
        [ngbTypeahead]="searchTier"
        [inputFormatter]="t => t.memberName"
        [resultFormatter]="t => t.memberName"
        (selectItem)="onSelectTier($event)"
        [editable]="false"
      />
    </div>
  </div>
</div>
