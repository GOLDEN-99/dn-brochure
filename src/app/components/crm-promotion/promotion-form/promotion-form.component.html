<section class="m-3">
  <ng-content select="[slot=header]" />

  <div class="card mb-3">
    <div class="card-body">
      <h2 class="card-title">ข้อมูลทั่วไป</h2>
      <app-promotion-master [form]="promotionForm.promotionMaster" />
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <h2 class="card-title">เงื่อนไขวัน เวลา</h2>
      <app-promotion-datetime [form]="promotionForm.promotionDatetime" />
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <h2 class="card-title">เงื่อนไขตามสมาชิก</h2>
      <app-promotion-limit-usage
        [branchForm]="promotionForm.promotionBranch"
        [memberForm]="promotionForm.promotionMember"
      />
    </div>
  </div>

  @if (showFilterOption()) {
    <div class="card mb-3">
      <div class="card-body">
        <div class="d-flex justify-content-between">
          <h2 class="card-title">เงื่อนไขตามสินค้า</h2>
          <div class="d-flex justify-content-end gap-1">
            @if (showPool()) {
              <!--
                BILL: the group only says WHICH goods the tier threshold measures, so there is no
                count box -- the baht minimum is the tier's own thresholdValue.
              -->
              <button
                class="btn btn-outline-primary"
                (click)="onAddSkuProductExist()"
              >
                เพิ่มกลุ่มสินค้าที่นับยอด
              </button>
            } @else if (!showItem()) {
              <!--
                BUNDLE only. The by-baht button that used to sit beside this one wrote
                filterType 'SUBTOTAL', which CrmPromotionEngine does not read: it counts UNITS
                via `required = FilterValue > 0 ? FilterValue : 1` whatever the type says, so
                "500 baht of A" was evaluated as "500 pieces of A" and never fired. Baht-scoped
                bundles need real engine work; baht-scoped BILL promotions are the showPool
                branch above, which the engine already supports.
              -->
              <button
                class="btn btn-outline-primary"
                (click)="onAddSkuProductCount()"
              >
                เพิ่มเงื่อนไขตามจำนวน(ชิ้น)
              </button>
            }
          </div>
        </div>
        <app-promotion-product-filter [form]="promotionForm" />
      </div>
    </div>
  }

  <div class="card mb-3">
    <div class="card-body">
      <h2 class="card-title">สิทธิประโยชน์</h2>
      @if (formModel().promotionMaster.promotionType === "ITEM") {
        <app-inline-benefit [form]="promotionForm.promotionBenefit" />
      } @else {
        <app-benefit-select [form]="promotionForm.promotionBenefit" />
      }
    </div>
  </div>

  <button
    class="btn btn-primary w-100"
    [disabled]="!canSubmit()"
    (click)="onSubmit()"
  >
    @if (submitting()) {
      กำลังบันทึก...
    } @else {
      {{ submitLabel() }}
    }
  </button>
</section>
