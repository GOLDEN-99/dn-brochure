<div class="row">
  <div class="col">
    <div class="form-check form-switch">
      <input
        class="form-check-input"
        type="checkbox"
        id="is-branch-spec"
        [ngModel]="branchLimit()"
        (ngModelChange)="toggleBranchLimit($event)"
      />
      <label class="form-check-label" for="is-branch-spec">จำกัดสาขา</label>
    </div>
  </div>
  <div class="col">
    <app-search-picker
      inputId="search-branch"
      label="ชื่อสาขา"
      [items]="renderBranch()"
      [searchBy]="branchName"
      [format]="branchName"
      [limit]="10"
      [disabled]="allowSelectBranch()"
      (picked)="onSelectBranch($event)"
    />
  </div>
  <div class="col">
    <app-search-picker
      inputId="search-promotion-branch"
      label="ชื่อกลุ่มสาขา"
      [items]="promotionBranchGroup()"
      [searchBy]="groupName"
      [format]="groupName"
      [disabled]="allowSelectBranch()"
      (picked)="onSelcetPromotionBranchGroup($event)"
    />
  </div>
</div>
