<div class="row mb-3">
  <div class="form-field col-md-4">
    <label class="form-label" for="benefit-type">สิทธิ</label>
    <select
      name="benefit-type"
      id="benefit-type"
      class="form-select"
      [(ngModel)]="action"
      (ngModelChange)="onActionChange($event)"
    >
      @for (opt of rewardOption(); track $index) {
        <option [value]="opt.action">{{ opt.label }}</option>
      }
    </select>
  </div>
  <div class="form-field col-md-4">
    <label for="benefit-thres" class="form-label">เงื่อนไขจาก</label>
    <select
      name="benefit-thrres"
      id="benefit-thres"
      class="form-select"
      [(ngModel)]="thresholdType"
    >
      @for (thres of thresholdList(); track thres.threshold) {
        <option [value]="thres.threshold">{{ thres.label }}</option>
      }
    </select>
  </div>
  <div class="form-check form-switch col-auto">
    <input
      class="form-check-input"
      type="checkbox"
      name="is-repeat"
      id="is-repeat"
      [ngModel]="isRepeat()"
      (ngModelChange)="onIsRepeatChange($event)"
    />
    <label for="is-repeat" class="form-check-label">ใช้ซ้ำ/ทุกๆ</label>
  </div>
</div>
<hr />
@for (tier of tiers(); track $index) {
  <app-benefit-tier
    [action]="action()"
    [thresholdType]="thresholdType()"
    [tier]="tier"
    (tierChange)="onChangeTierAt($index, $event)"
    [canDelete]="tiers().length > 1"
    (deleteTier)="onDeleteTier($index)"
  />
}
<!---->
<div class="d-flex justify-content-end">
  <button class="btn btn-success" (click)="addTier()" [disabled]="isRepeat()">
    เพิ่มสิทธิประโยชน์
  </button>
</div>
@if (action() === "PWP") {
  <hr />
  <app-promotion-pwp [(rewardPool)]="rewardPool" />
}
@if (action() === "GIFT") {
  <hr />
  <app-promotion-gift [(rewardPool)]="rewardPool" />
}
