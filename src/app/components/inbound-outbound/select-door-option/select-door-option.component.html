<ul class="option-list">
  @for (door of doorList(); track $index) {
  <li
    class="otption-item rounded border p-3"
    tabindex="0"
    (click)="radio.click()"
  >
    <div class="form-check">
      <input
        #radio
        class="form-check-input"
        type="radio"
        [name]="'gate' + id"
        [attr.id]="door.doorId + '-radio-' + id"
        [value]="door.doorId"
        [ngModel]="activeDoor()?.doorId"
        (ngModelChange)="onChangeGate(door)"
        [disabled]="readOnly()"
      />
      <label class="form-check-label" [attr.for]="door.doorId + '-radio-' + id">
        {{ door.name }}
      </label>
    </div>
    <span>{{ door.note }}</span>
    <div style="display: flex; align-items: center">
      <i class="bi bi-alarm me-2"> </i>
      <div>{{ door.timeUse }} นาที</div>
    </div>
  </li>
  }
</ul>
