<div class="mb-3">
  <label for="supplier-select">เลือกซัพ</label>
  <select
    name="supplier-select"
    id="supplier-select"
    [(ngModel)]="compGroupCode"
    class="form-select"
  >
    <option value="">ทั้งหมด</option>
    @for (item of optionsList(); track $index) {
    <option [ngValue]="item.compGroupCode">{{ item.compGroupDesc }}</option>
    }
  </select>
</div>
