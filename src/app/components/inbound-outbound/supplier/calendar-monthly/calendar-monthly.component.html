@for (door of doorList(); track $index) {
<div class="app-form-check">
  <input
    type="checkbox"
    [ngModel]="door.check"
    (ngModelChange)="toggleDoor(door.doorId)"
    [attr.id]="door.doorId + '-door-daily'"
  />
  <label [attr.for]="door.doorId + '-door-daily'">{{ door.name }}</label>
</div>
}

<div class="calendar-header">

  </div> -->
  <!-- <button class="btn" (click)="toNextMonth()">

</div>
<div class="calendar">
  <div class="calendar-row">
    <div class="calendar-th" role="columnheader">จันทร์</div>
    <div class="calendar-th" role="columnheader">อังคาร</div>
    <div class="calendar-th" role="columnheader">พุธ</div>
    <div class="calendar-th" role="columnheader">พฤหัส</div>
    <div class="calendar-th" role="columnheader">ศุกร์</div>
    <div class="calendar-th" role="columnheader">เสาร์</div>
    <div class="calendar-th" role="columnheader">อาทิตย์</div>
  </div>
  @for (week of cal; let i = $index; track i) {
  <div class="calendar-row">
    @for (d of week; let j = $index; track j) {
    <app-calendar-cell
      [isoDate]="d.date"
      [month]="formated().month"
      [color]="d.status"
    />
    }
  </div>
  }
</div>

<ng-template #monthly2 let-modal>
  <div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">Profile update</h4>
    <button
      type="button"
      class="btn-close"
      aria-label="Close"
      (click)="modal.dismiss('Cross click')"
    ></button>
  </div>
  <div class="modal-body">
    <form>
      <div class="mb-3">
        <label for="dateOfBirth">Date of birth</label>
        <div class="input-group">
          <button
            class="btn btn-outline-secondary bi bi-calendar3"
            type="button"
          ></button>
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button
      type="button"
      class="btn btn-outline-secondary"
      (click)="modal.close('Save click')"
    >
      Save
    </button>
  </div>
</ng-template>
