<!---->
@for (door of doorList(); track $index) {
<div class="app-form-check">
  <input
    type="checkbox"
    [ngModel]="door.check"
    (ngModelChange)="toggleDoor(door.doorId)"
    [attr.id]="door.doorId + '-door-weekly'"
  />
  <label [attr.for]="door.doorId + '-door-weekly'">{{ door.name }}</label>
</div>
}
<!---->
@let range = dateRange();
<form class="row row-cols-sm-auto mb-3">
  <div class="col-12">
    <div class="dp-hidden position-absolute">
      <div class="input-group">
        <input
          name="datepicker"
          class="form-control"
          ngbDatepicker
          #datepicker="ngbDatepicker"
          [autoClose]="'outside'"
          (dateSelect)="onDateSelection($event)"
          [dayTemplate]="t"
          [startDate]="selectedDate()!"
          tabindex="-1"
        />
        <ng-template #t let-date let-focused="focused">
          <span
            class="custom-day"
            [class.focused]="focused"
            [class.range]="isRange(date)"
            [class.faded]="isHovered(date) || isInside(date)"
            [class.outside]="isOtherMonth(date)"
            (mouseenter)="hoveredDate = date"
            (mouseleave)="hoveredDate = null"
          >
            {{ date.day }}
          </span>
        </ng-template>
      </div>
    </div>
    <div class="input-group">
      <input
        disabled
        #dpFromDate
        class="form-control"
        placeholder="yyyy-mm-dd"
        name="dpFromDate"
        [value]="thaiDate(range.start)"
      />
    </div>
  </div>
  <div class="col-12">
    <div class="input-group">
      <input
        disabled
        #dpToDate
        class="form-control"
        placeholder="yyyy-mm-dd"
        name="dpToDate"
        [value]="thaiDate(range.end)"
      />
    </div>
  </div>
  <button
    class="btn btn-outline-secondary bi bi-calendar3"
    (click)="datepicker.toggle()"
    type="button"
  ></button>
</form>

<div class="calendar">
  <div class="calendar-row">
    <div class="calendar-th" role="columnheader"></div>
    <div class="calendar-th" role="columnheader">จันทร์</div>
    <div class="calendar-th" role="columnheader">อังคาร</div>
    <div class="calendar-th" role="columnheader">พุธ</div>
    <div class="calendar-th" role="columnheader">พฤหัส</div>
    <div class="calendar-th" role="columnheader">ศุกร์</div>
    <div class="calendar-th" role="columnheader">เสาร์</div>
    <div class="calendar-th" role="columnheader">อาทิตย์</div>
  </div>
  <div class="calendar-row" style="background-color: #eeeeee; height: 24px">
    <div class="calendar-th" role="columnheader">เวลา</div>
    @for (h of header(); track $index) {
    <div class="calendar-th" role="columnheader">{{ h }}</div>
    }
  </div>

  @for (slot of displayList(); track $index) {

  <div
    class="calendar-row"
    style="height: 38px; border-bottom: 1px solid #eeeeee"
  >
    <button class="calendar-cell" style="flex: 1 1 58px">
      <div class="cell-content">
        <div class="cell-label">{{ slot[0].time }}</div>
      </div>
    </button>
    @for (s of slot; let j = $index;track j) {
    <app-calendar-cell
      [isoDate]="s.date"
      [month]="formateMonth(s.date)"
      [withOutDate]="true"
      [color]="s.status"
    />
    }
  </div>
  }
</div>
