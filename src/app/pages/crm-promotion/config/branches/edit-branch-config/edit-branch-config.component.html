<div>
  <a class="btn btn-outline-secondary btn-sm me-2" routerLink="..">
    <i class="bi bi-arrow-left"></i>กลับ
  </a>
  <span>placeholder</span>
</div>
<!-- Main page: selected branches -->
<div class="card border-0 shadow-sm">
  <div
    class="card-header bg-white border-bottom d-flex align-items-center justify-content-between"
  >
    <span class="fw-semibold">
      สาขาที่เลือกแล้ว
      <span class="badge bg-primary ms-2">{{
        currentBranchInGroup().length
      }}</span>
    </span>

    <a class="btn btn-primary btn-sm" routerLink="add">
      <i class="bi bi-plus-lg me-1"></i>เพิ่มสาขา
    </a>
  </div>
  <div style="max-height: 500px; overflow-y: auto">
    <table class="table table-hover mb-0">
      <thead class="table-light" style="position: sticky; top: 0; z-index: 1">
        <tr>
          <th scope="col">สาขา</th>
          <th scope="col" style="width: 64px"></th>
        </tr>
      </thead>
      <tbody>
        @for (item of currentBranchInGroup(); track item.id) {
          <tr>
            <td class="align-middle">{{ item.branchName }}</td>
            <td>
              <button
                class="btn btn-danger btn-sm btn-squre"
                [disabled]="deletingId() === item.id"
                (click)="deleteBranch(item.id)"
              >
                @if (deletingId() === item.id) {
                  <span class="spinner-border spinner-border-sm"></span>
                } @else {
                  <i class="bi bi-trash"></i>
                }
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="2" class="text-center text-muted py-5">
              <i class="bi bi-inbox d-block fs-3 mb-1"></i>
              ยังไม่ได้เลือกสาขา
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  @if (deleteError()) {
    <div class="card-footer bg-white">
      <div class="alert alert-danger mb-0 py-2 small">{{ deleteError() }}</div>
    </div>
  }
</div>
