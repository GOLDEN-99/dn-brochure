<div class="card border-0 shadow-sm">
  <div class="card-header bg-white border-bottom d-flex align-items-center justify-content-between">
    <span class="fw-semibold">
      สินค้าที่เลือกแล้ว
      <span class="badge bg-primary ms-2">{{ currentProductInGroup().length }}</span>
    </span>
    <a class="btn btn-primary btn-sm" routerLink="add">
      <i class="bi bi-plus-lg me-1"></i>เพิ่มสินค้า
    </a>
  </div>
  <div style="max-height: 500px; overflow-y: auto">
    <table class="table table-hover mb-0">
      <thead class="table-light" style="position: sticky; top: 0; z-index: 1">
        <tr>
          <th scope="col">สินค้า</th>
          <th scope="col" style="width: 64px"></th>
        </tr>
      </thead>
      <tbody>
        @for (item of currentProductInGroup(); track item.goodCode) {
          <tr>
            <td class="align-middle">{{ item.goodName }}</td>
            <td>
              <button class="btn btn-danger btn-sm btn-squre">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="2" class="text-center text-muted py-5">
              <i class="bi bi-inbox d-block fs-3 mb-1"></i>
              ยังไม่ได้เลือกสินค้า
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
