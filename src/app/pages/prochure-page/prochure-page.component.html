@let headdata = head(); @if (headdata) {
<section class="container">
  <div class="d-flex my-3 align-items-center justify-content-between">
    <h4 class="shop-name">{{ headdata.wholeName }}</h4>

    <div class="d-flex">
      <div>ประเภท :</div>
      <div>{{ headdata.promotionType | promotionPipe }}</div>
    </div>
  </div>

  <div class="content-wrapper">
    <app-prochure
      [head]="headdata"
      [itemList]="currentGroup()"
      [size]="maxItem()"
    />
  </div>
  <nav class="mt-3 d-flex justify-content-center">
    <ul class="pagination">
      @for (item of totalPage(); track $index) {
      <li class="page-item">
        <button
          (click)="onClick(item)"
          [class]="$index === currentPage() ? 'page-link active' : 'page-link'"
        >
          {{ item + 1 }}
        </button>
      </li>
      }
    </ul>
  </nav>
  <div class="d-flex align-items-center mb-3 justify-content-between action">
    <button class="btn btn-primary" (click)="onExport()">export</button>
    <a routerLink="" class="btn btn-info">back</a>
  </div>
</section>
<div class="not-show">
  @for (g of content(); track $index) {
  <app-prochure
    [head]="headdata"
    [itemList]="g"
    [size]="maxItem()"
    [isStatic]="true"
  />
  }
</div>
} @if (inprogress()) {
<div class="loading">
  <div
    class="spinner-border text-success"
    role="status"
    style="width: 10rem; height: 10rem"
  >
    <span class="sr-only"></span>
  </div>
</div>
}
