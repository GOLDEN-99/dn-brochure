<h4>รายปี</h4>
<div class="mb-3">
  <div class="row">
    <div class="app-form-select col">
      <label for="month">เดือน</label>
      <select
        name="month"
        id="month"
        [ngModel]="date().month"
        (ngModelChange)="changeMonth($event)"
      >
        @for (month of monthArray; track month) {
          <option [ngValue]="month">{{ month }}</option>
        }
      </select>
    </div>
    <div class="app-form-select col">
      <label for="year">ปี</label>
      <select
        name="year"
        id="year"
        [ngModel]="date().year"
        (ngModelChange)="changeYear($event)"
      >
        @for (year of yearArray; track year) {
          <option [ngValue]="year">{{ year }}</option>
        }
      </select>
    </div>
    <div class="app-form-field col">
      <label for="code">รหัสซัพ</label>
      <input type="text" id="code" name="code" [(ngModel)]="compCode" />
    </div>
  </div>
  <button
    class="btn btn-primary w-100 mb-3"
    [disabled]="disable1()"
    (click)="exportSupplierAnnual(1)"
  >
    รายงานซัพพลายเออร์ DN รายปี
  </button>
  <button
    class="btn btn-success w-100 mb-3"
    [disabled]="disable1()"
    (click)="exportSupplierAnnual(2)"
  >
    รายงานซัพพลายเออร์ HU รายปี
  </button>
  <button
    class="btn btn-primary w-100 mb-3"
    [disabled]="disable1()"
    (click)="exportSupplierMonthDetial(1)"
  >
    รายงานซัพพลายเออร์ DN รายเดือน (ละเอียด)
  </button>
  <button
    class="btn btn-success w-100 mb-3"
    [disabled]="disable1()"
    (click)="exportSupplierMonthDetial(2)"
  >
    รายงานซัพพลายเออร์ HU รายเดือน (ละเอียด)
  </button>
</div>

<app-account-issuing-document-report
  (fail)="onError($event)"
  (loading)="onLoading($event)"
  (success)="onSuccess($event)"
/>

<h4>สรุปรายได้รายปี</h4>
<div class="row mb-3 px-3" style="gap: 1rem">
  <button class="btn btn-primary col" (click)="exportAnnualIncomeReport(1)">
    รายงาน DN
  </button>
  <button class="btn btn-success col" (click)="exportAnnualIncomeReport(2)">
    รายงาน HU
  </button>
</div>
