<h4>รายปี</h4>
<div class="mb-3">
  <div class="row">
    <div class="app-form-select col">
      <label for="month">เดือน</label>
      <select
        name="month"
        id="month"
        [ngModel]="date().month"
        (ngModelChange)="changeMonth($event)"
      >
        @for (month of monthArray; track month) {
        <option [ngValue]="month">{{ month }}</option>
        }
      </select>
    </div>
    <div class="app-form-select col">
      <label for="year">ปี</label>
      <select
        name="year"
        id="year"
        [ngModel]="date().year"
        (ngModelChange)="changeYear($event)"
      >
        @for (year of yearArray; track year) {
        <option [ngValue]="year">{{ year }}</option>
        }
      </select>
    </div>
    <div class="app-form-field col">
      <label for="code">รหัสซัพ</label>
      <input type="text" id="code" name="code" [(ngModel)]="compCode" />
    </div>
  </div>
  <button
    class="btn btn-primary w-100 mb-3"
    [disabled]="disable1()"
    (click)="exportAnnualDN()"
  >
    รายงานซัพพลายเออร์ DN รายปี
  </button>
  <button
    class="btn btn-success w-100 mb-3"
    [disabled]="disable1()"
    (click)="exportAnnualHU()"
  >
    รายงานซัพพลายเออร์ HU รายปี
  </button>
  <div class="row">
    <div class="col">ซัพ {{ compType() }}</div>
    <div class="col"></div>
  </div>
  @for (item of yearDis(); track item.id) {
  <div class="row">
    <div class="col">{{ item.comp }}</div>
    <div class="col">
      <button class="btn btn-primary" (click)="toAnnualExcel()">excel</button>
    </div>
  </div>
  }
</div>
<app-other-income-order-report [year]="date().year" />
<h4>รายงานเพื่อออกใบแจ้งหนี้</h4>
<div class="row mb-3 px-3" style="gap: 1rem">
  <button class="btn btn-primary col" (click)="exportInvoice(1)">
    รายงาน DN
  </button>
  <button class="btn btn-success col" (click)="exportInvoice(2)">
    รายงาน HN
  </button>
</div>
<h4>รายงานเพื่อออกใบเสร็จ</h4>
<div class="row mb-3 px-3" style="gap: 1rem">
  <button class="btn btn-primary col" (click)="exportRece(1)">รายงาน DN</button>
  <button class="btn btn-success col" (click)="exportRece(2)">รายงาน HN</button>
</div>
<h4>สรุป light box</h4>
<div class="row mb-3 px-3" style="gap: 1rem">
  <button class="btn btn-primary col" (click)="exportLight(1)">
    รายงาน DN
  </button>
  <button class="btn btn-success col" (click)="exportLight(2)">
    รายงาน HN
  </button>
</div>
<h4>สรุปรายได้รายปี</h4>
<div class="row mb-3 px-3" style="gap: 1rem">
  <button class="btn btn-primary col" (click)="exportAnnualIncomeReport(1)">
    รายงาน DN
  </button>
  <button class="btn btn-success col" (click)="exportAnnualIncomeReport(2)">

  </button>
</div>
<h4>รายละเอียดยอดซื้อรายเดือน</h4>
<div class="row">
  <div class="app-form-select col">
    <label for="month-month-buy">เดือน</label>
    <select
      name="month-month-buy"
      id="month-month-buy"
      [ngModel]="date().month"
      (ngModelChange)="changeMonth($event)"
    >
      @for (month of monthArray; track month) {
      <option [ngValue]="month">{{ month }}</option>
      }
    </select>
  </div>
  <div class="app-form-select col">
    <label for="year-month-buy">ปี</label>
    <select
      name="year-month-buy"
      id="year-month-buy"
      [ngModel]="date().year"
      (ngModelChange)="changeYear($event)"
    >
      @for (year of yearArray; track year) {
      <option [ngValue]="year">{{ year }}</option>
      }
    </select>
  </div>
</div>
<div class="row mb-3 px-3" style="gap: 1rem">
  <button class="btn btn-primary col" (click)="exportMonthBuy(1)">
    รายงาน DN
  </button>
  <button class="btn btn-success col" (click)="exportMonthBuy(2)">
    รายงาน HU
  </button>
</div>
<h4>รายละเอียดรายได้อื่นๆอื่นๆรายเดือน</h4>
<div class="row mb-3 px-3" style="gap: 1rem">
  <button class="btn btn-primary col" (click)="exportMonthInce(1)">
    รายงาน DN
  </button>
  <button class="btn btn-success col" (click)="exportMonthInce(2)">
    รายงาน HU
  </button>
</div>
