<h1>รายได้อื่นๆ 2 หัว</h1>

<!-- Top: search / create -->
<div class="d-flex gap-2 mb-3">
  <input
    type="text"
    class="form-control"
    placeholder="ชื่อหัวร่วม"
    [ngModel]="term()"
    (ngModelChange)="term.set($event)"
  />
  <button
    class="btn btn-success text-nowrap"
    [disabled]="!canAdd() || saving() || resultNotEmpty() || deleting()"
    (click)="onAdd()"
  >
    @if (saving()) {
      <span class="spinner-border spinner-border-sm me-1"></span>
    }
    เพิ่มหัวร่วม
  </button>
</div>

<!-- Bottom: pair list -->
<table class="table table-striped table-bordered">
  <thead>
    <tr>
      <th style="width: 25%">ชื่อ pair</th>
      <th style="width: 25%">รหัสซับ DN</th>
      <th style="width: 25%">รหัสซับ HU</th>
      <th style="width: 25%"></th>
    </tr>
  </thead>
  <tbody>
    @for (pair of pairList(); track pair.id) {
      <tr>
        <td>{{ pair.displayName }}</td>
        <td>{{ pair.dnCompCode ?? "-" }}</td>
        <td>{{ pair.huCompCode ?? "-" }}</td>
        <td>
          @if (isCompletePair(pair)) {
            <a [routerLink]="[pair.id]">รายละเอียด</a>
          } @else {
            <div style="display: flex; justify-content: center">
              <button
                class="btn btn-squre btn-danger"
                (click)="onDelete(pair.id)"
                [disabled]="deleting()"
              >
                <i class="bi bi-trash"></i>
              </button>
            </div>
          }
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5" class="text-center text-muted">ไม่พบข้อมูล</td>
      </tr>
    }
  </tbody>
</table>
