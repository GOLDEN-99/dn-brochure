<section class="app-container">
  @if (invalidValue()) {
    <div>ไม่พบเอกสาร</div>
  } @else {
    @let e = currentResult();@let branches = e.branchList;
    @let periods = e.periodList;
    <app-other-income-head-edit
      [headIncomeList]="e.headIncomeList"
      [head]="e.head"
      [comp]="e.company"
      [event]="e.event"
      [canEdit]="false"
    />
    <app-other-income-light-edit
      [eventDetail]="e.light"
      [totalIncome]="e.head.accIncome"
    />
    <app-other-income-branch
      [periodId]="periodId()"
      [canEdit]="isPurchase"
      [lightId]="e.light.id"
      [branchList]="branches"
      (refetch)="onRefetch()"
    />
    @for (period of periods; track period.id) {
      <app-other-income-period-display
        [possibleIncome]="e.headIncomeList"
        [period]="period"
        [canEdit]="isPurchase"
        [isPurchase]="isPurchase"
        [compCode]="e.company.compCode"
        [compType]="e.company.compType"
        (success)="onSuccess($event)"
        (fail)="onFail($event)"
      />
    }
  }

  <button (click)="onDelete()" class="btn btn-danger w-100">ลบ</button>
  <a routerLink=".." class="btn btn-secondary w-100 mt-2">กลับ</a>
</section>

<!-- Delete confirmation modal -->
<ng-template #deleteModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">ยืนยันการลบ</h5>
    <button
      type="button"
      class="btn-close"
      aria-label="Close"
      (click)="modal.dismiss()"
      [disabled]="deleting()"
    ></button>
  </div>
  <div class="modal-body">
    <div class="alert alert-danger d-flex align-items-start">
      <i class="bi bi-exclamation-triangle-fill me-2 mt-1"></i>
      <div>
        <strong>คุณต้องการลบข้อมูลนี้ใช่หรือไม่?</strong>
        <p class="mb-0 mt-2 small">การลบข้อมูลนี้จะไม่สามารถกู้คืนได้</p>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button
      type="button"
      class="btn btn-secondary"
      (click)="modal.dismiss()"
      [disabled]="deleting()"
    >
      ยกเลิก
    </button>
    <button
      type="button"
      class="btn btn-danger"
      (click)="confirmDelete()"
      [disabled]="deleting()"
    >
      @if (deleting()) {
        <span class="spinner-border spinner-border-sm me-1"></span>
        กำลังลบ...
      } @else {
        <i class="bi bi-trash me-1"></i>
        ยืนยันลบ
      }
    </button>
  </div>
</ng-template>
