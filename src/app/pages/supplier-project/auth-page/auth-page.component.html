@let data = formData();
<div class="app-form-field">
  <label for="supplierCode">รหัสซัพ</label>
  <input
    type="text"
    name="supplierCode"
    id="supplierCode"
    readonly
    [ngModel]="data.compCode"
  />
</div>
<div class="p-4 mb-3" style="background-color: #e0e0e0">
  <div class="app-form-field">
    <label for="username">Username</label>
    <input
      type="text"
      name="username"
      id="username"
      [ngModel]="data.username"
      (ngModelChange)="updateUsername($event)"
      [readOnly]="readonly()"
    />
  </div>
  <div class="app-form-field">
    <label for="userpass">Password</label>
    <div class="input-group">
      <input
        [type]="passwordType()"
        name="userpass"
        id="userpass"
        [ngModel]="data.userpass"
        (ngModelChange)="updatePassword($event)"
        [readOnly]="readonly()"
      />
      <span
        class="input-group-text"
        id="basic-addon1"
        tabindex="0"
        (click)="togglePassword()"
      >
        @if(passwordType() === 'text'){
        <i class="bi bi-eye-slash"></i>
        }@else{
        <i class="bi bi-eye"></i>
        }
      </span>
    </div>
  </div>
</div>
