<h1 class="text-center">เข้าสู่ระบบ ( {{ compType() }} )</h1>
<form [formGroup]="loginForm" class="p-4 border rounded">
  <div class="app-form-field">
    <label for="username">Username</label>
    <input type="text" name="username" id="username" formControlName="user" />
  </div>
  <div class="app-form-field">
    <label for="password">Password</label>
    <div class="input-group">
      <input
        [type]="passwordType()"
        name="password"
        id="password"
        formControlName="password"
      />
      <span
        class="input-group-text"
        id="basic-addon1"
        tabindex="0"
        (click)="togglePassword()"
      >
        @if(passwordType() === 'text'){
        <i class="bi bi-eye-slash"></i>
        }@else{
        <i class="bi bi-eye"></i>
        }
      </span>
    </div>
  </div>
  <div class="d-flex justify-content-center">
    <button
      class="btn btn-success"
      [disabled]="disable()"
      (click)="handleLogin()"
    >
      เข้าสู่ระบบ
    </button>
  </div>
</form>
