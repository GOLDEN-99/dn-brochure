@let data = formState(); @if (compType === 'HU') {
<ul
  ngbNav
  #nav="ngbNav"
  [(activeId)]="active"
  [destroyOnHide]="false"
  class="nav-tabs"
  style="border: none"
>
  <li [ngbNavItem]="1">
    <button ngbNavLink>เงื่อนไขการคืนซัพฯ</button>
    <ng-template ngbNavContent>
      <div class="condi-form">
        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="return-sub"
            id="return-sup-check-return"
            [value]="true"
            [ngModel]="data.supReturn"
            (ngModelChange)="updator('supReturn')($event)"
            [disabled]="readonly()"
          />
          <label class="form-check-label" for="return-sup-check-return">
            รับคืน
          </label>
        </div>
        <!---->
        @if (data.supReturn) {
        <div style="padding: 0 24px">
          <div class="app-form-field-inline">
            <div>
              <label for="return-sup-before">ก่อนหมดอายุ</label>
            </div>
            <div>
              <input
                type="number"
                name="return-sup-before"
                id="return-sup-before"
                [ngModel]="data.supMonthBeforeExp"
                (ngModelChange)="updator('supMonthBeforeExp')($event)"
                [readOnly]="readonly()"
                [min]="0"
              />
            </div>
            <div>
              <span>เดือน</span>
            </div>
          </div>
          <div class="app-form-field-inline">
            <div>
              <label for="return-sup-after">หลังหมดอายุ</label>
            </div>
            <div>
              <input
                type="number"
                name="return-sup-after"
                id="return-sup-after"
                [ngModel]="data.supMonthAfterExp"
                (ngModelChange)="updator('supMonthAfterExp')($event)"
                [min]="0"
                [readOnly]="readonly()"
              />
            </div>
            <div>
              <span>เดือน</span>
            </div>
          </div>
          <div
            class="app-form-check"
            style="display: flex; gap: 16px; align-items: center"
          >
            <input
              type="checkbox"
              id="return-sub-whole"
              name="return-sub-whole"
              [ngModel]="data.supFullBox"
              (ngModelChange)="updator('supFullBox')($event)"
              [disabled]="readonly()"
            />
            <label for="return-sub-whole">เต็มกล่อง</label>
          </div>
          <div
            class="app-form-check"
            style="display: flex; gap: 16px; align-items: center"
          >
            <input
              type="checkbox"
              id="return-sub-lot"
              name="return-sub-lot"
              [ngModel]="data.supSameLot"
              (ngModelChange)="updator('supSameLot')($event)"
              [disabled]="readonly()"
            />
            <label for="return-sub-lot">ล็อตเดียวกัน</label>
          </div>
        </div>
        }
        <!---->
        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="return-sub"
            id="return-sup-check-not-return"
            [value]="false"
            [ngModel]="data.stkReturn"
            (ngModelChange)="noSupReturn()"
            [disabled]="readonly()"
          />
          <label class="form-check-label" for="return-sup-check-not-return">
            ไม่รับคืน
          </label>
        </div>
      </div>
    </ng-template>
  </li>
  <li [ngbNavItem]="2">
    <button ngbNavLink>เงื่อนไขสาขาส่งคืน</button>
    <ng-template ngbNavContent>
      <div class="condi-form">
        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="return-branch"
            id="return-branch-check-return"
            [value]="true"
            [ngModel]="data.stkReturn"
            (ngModelChange)="updator('stkReturn')($event)"
            [disabled]="readonly()"
          />
          <label class="form-check-label" for="return-branch-check-return">
            รับคืน
          </label>
        </div>
        <!---->
        @if (data.stkReturn) {
        <div style="padding: 0 24px">
          <div class="app-form-field-inline">
            <div>
              <label for="return-branch-before">ก่อนหมดอายุ</label>
            </div>
            <div>
              <input
                type="number"
                name="return-branch-before"
                id="return-branch-before"
                [ngModel]="data.stkMonthBeforeExp"
                (ngModelChange)="updator('stkMonthBeforeExp')($event)"
                [readOnly]="readonly()"
                [min]="0"
              />
            </div>
            <div>
              <span>เดือน</span>
            </div>
          </div>
          <div class="app-form-field-inline">
            <div>
              <label for="return-branch-after">หลังหมดอายุ</label>
            </div>
            <div>
              <input
                type="number"
                name="return-branch-after"
                id="return-branch-after"
                [ngModel]="data.stkMonthAfterExp"
                (ngModelChange)="updator('stkMonthAfterExp')($event)"
                [readOnly]="readonly()"
                [min]="0"
              />
            </div>
            <div>
              <span>เดือน</span>
            </div>
          </div>
          <div
            class="app-form-check"
            style="display: flex; gap: 16px; align-items: center"
          >
            <input
              type="checkbox"
              id="return-branch-whole"
              name="return-branch-whole"
              [ngModel]="data.stkFullBox"
              (ngModelChange)="updator('stkFullBox')($event)"
              [disabled]="readonly()"
            />
            <label for="return-branch-whole">เต็มกล่อง</label>
          </div>
          <div
            class="app-form-check"
            style="display: flex; gap: 16px; align-items: center"
          >
            <input
              type="checkbox"
              id="return-branch-lot"
              name="return-branch-lot"
              [ngModel]="data.stkSameLot"
              (ngModelChange)="updator('stkSameLot')($event)"
              [disabled]="readonly()"
            />
            <label for="return-branch-lot">ล็อตเดียวกัน</label>
          </div>
        </div>
        }
        <!---->
        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="return-branch"
            id="return-branch-check-not-return"
            [value]="false"
            [ngModel]="data.stkReturn"
            (ngModelChange)="noStkReturn()"
            [disabled]="readonly()"
          />
          <label class="form-check-label" for="return-branch-check-not-return">
            ไม่รับคืน
          </label>
        </div>
      </div>
    </ng-template>
  </li>
</ul>
<div [ngbNavOutlet]="nav" class="mb-3"></div>
}@else {
<div class="mb-3">DN ไม่ระบุเงื่อนไขการคืน</div>
}
