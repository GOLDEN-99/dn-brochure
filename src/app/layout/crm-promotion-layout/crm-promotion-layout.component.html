<!-- Backdrop (mobile/tablet only) -->
@if (sidebarOpen()) {
  <div class="sidebar-backdrop d-xl-none" (click)="toggleSidebar()"></div>
}

<div class="layout-wrapper">
  <!-- Sidebar -->
  <nav class="sidebar" [class.sidebar--open]="sidebarOpen()">
    <div class="sidebar__header">
      <span class="sidebar__title">CRM Promotion</span>
      <button
        class="sidebar__close btn btn-link d-xl-none"
        (click)="toggleSidebar()"
      >
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <ul class="sidebar__nav nav flex-column">
      <li class="nav-item">
        <a
          class="nav-link"
          routerLink="/crm-promotion"
          [routerLinkActive]="'active'"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeSidebarOnMobile()"
        >
          <i class="bi bi-house-door me-2"></i> Home
        </a>
      </li>
      <li class="nav-item mt-3">
        <span class="sidebar__section-label">Create</span>
      </li>
      @for (createRoute of createObject; track $index) {
        <li class="nav-item">
          <a
            class="nav-link"
            [routerLink]="createRoute.path"
            routerLinkActive="active"
            (click)="closeSidebarOnMobile()"
          >
            <i [className]="createRoute.icon"></i> {{ createRoute.name }}
          </a>
        </li>
      }

      <li class="nav-item mt-3">
        <span class="sidebar__section-label">Config</span>
      </li>
      <li class="nav-item">
        <a
          class="nav-link"
          routerLink="/crm-promotion/config-branch"
          routerLinkActive="active"
          (click)="closeSidebarOnMobile()"
        >
          <i class="bi bi-diagram-3 me-2"></i> Branch
        </a>
      </li>
      <li class="nav-item">
        <a
          class="nav-link"
          routerLink="/crm-promotion/config-product"
          routerLinkActive="active"
          (click)="closeSidebarOnMobile()"
        >
          <i class="bi bi-box me-2"></i> Product
        </a>
      </li>
      <li class="nav-item">
        <a
          class="nav-link"
          routerLink="/crm-promotion/config-promotion-set"
          routerLinkActive="active"
          (click)="closeSidebarOnMobile()"
        >
          <i class="bi bi-collection me-2"></i> Promotion Set
        </a>
      </li>
    </ul>
  </nav>

  <!-- Main content -->
  <div class="layout-main" #layoutMain>
    <!-- Topbar (hamburger visible on < xl) -->
    <header class="topbar d-xl-none">
      <button class="topbar__hamburger btn btn-link" (click)="toggleSidebar()">
        <i class="bi bi-list fs-4"></i>
      </button>
      <span class="topbar__title">CRM Promotion</span>
    </header>

    <main class="layout-content">
      <router-outlet />
    </main>
  </div>
</div>
